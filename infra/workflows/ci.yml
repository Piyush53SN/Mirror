name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: tokens, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Secret scan (patterns + entropy, tracked files)
        run: npm run security:secrets
      - name: Typecheck and tests (tokens, types, 200+ checks)
        run: npm run tokens && npm run typecheck && npm test

      # Deliberately not part of `verify`: measuring the prototype needs a real
      # browser, which is not available on every runner. A skipped measurement is
      # reported, never treated as a pass.
      - name: Prototype measurements (non-blocking)
        id: measure
        continue-on-error: true
        run: npm run check:prototype
      - name: Note if measurements were skipped
        if: steps.measure.outcome == 'failure'
        run: echo "::warning::Prototype measurement did not run (no browser). Tokens are unchanged and reviewed."

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install
        run: npm ci
      # Critical advisories block. High advisories are reported and tracked in
      # docs/PROGRESS.md; --strict turns them into failures once P1a upgrades the
      # Expo toolchain and the count reaches zero.
      - name: Audit the lockfile
        run: npm run security:deps
      - name: Upload the audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: .reports/dependencies.json
          if-no-files-found: warn

  bundle:
    name: bundle reachability (no vulnerable package ships)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install
        run: npm ci
      # Metro bundles the real app entry; the source map is the authoritative
      # module list. The check fails if any package that carries an advisory is
      # in it. Build-time parents (expo, metro, the CLI shim) are reported, not
      # treated as findings: the advisory belongs to a dependency they do not ship.
      - name: Bundle and check reachability
        run: npm run security:bundle
      - name: Upload the bundle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundle-report
          path: .reports/bundle.json
          if-no-files-found: warn

  privacy-scanner:
    name: privacy canary scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: npm ci
      - name: Scanner tests, end-to-end self-test, mitmproxy addon tests
        run: npm run test:privacy
