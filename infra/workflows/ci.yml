name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: tokens, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Verify (tokens, both TypeScript projects, all tests)
        run: npm run verify

      # Deliberately not part of `verify`: measuring the prototype needs a real
      # browser, which is not available on every runner. A skipped measurement is
      # reported, never treated as a pass.
      - name: Prototype measurements (non-blocking)
        id: measure
        continue-on-error: true
        run: npm run check:prototype
      - name: Note if measurements were skipped
        if: steps.measure.outcome == 'failure'
        run: echo "::warning::Prototype measurement did not run (no browser). Tokens are unchanged and reviewed."

  privacy-scanner:
    name: privacy canary scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: npm ci --legacy-peer-deps
      - name: Scanner tests, end-to-end self-test, mitmproxy addon tests
        run: npm run test:privacy
