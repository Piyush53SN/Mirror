name: Release - tag-triggered, GitHub Release, changelog, OTA guard, offline, privacy

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, guards, changelog, GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platforms
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install deps
        run: npm ci

      - name: Verify manifest versions match git tag
        run: |
          node scripts/release/bump-version.mjs --check
          APP_VER=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("apps/mobile/app.json","utf8")).expo.version)')
          if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ "v$APP_VER" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match app.json version v$APP_VER"
            exit 1
          fi

      - name: Verify (tokens, typecheck, tests, secret scan, bundle)
        run: npm run verify

      - name: OTA guard
        run: node scripts/android/check-ota-guard.mjs

      - name: Offline test
        run: node scripts/android/check-offline.mjs

      - name: Privacy canary
        run: npm run test:privacy

      - name: Expo prebuild
        run: |
          cd apps/mobile
          CI=1 EXPO_NO_GIT_STATUS=1 npx expo prebuild --platform android --no-install
          chmod +x android/gradlew
          cd ../..

      - name: Release Stage 1 preflight (before keystore materialization)
        run: make release-stage1

      - name: Restore stable debug keystore
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/apps/mobile/android/app/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            ls -lh "$KEYSTORE_PATH"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set - ephemeral keystore"
            keytool -genkeypair -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi

      - name: Build debug + gate
        run: |
          make android-build
          npm run android:manifest -- --variant debug --json .reports/merged-manifest-debug.json

      - name: Build release manifest + gate
        run: |
          cd apps/mobile/android
          ./gradlew :app:processReleaseManifest --no-daemon --stacktrace 2>&1 | tee ../../.reports/gradle-release.log
          cd ../..
          npm run android:manifest -- --variant release --json .reports/merged-manifest-release.json

      - name: Build release APK / AAB (upload-signed when secrets exist, else debug-signed mirror-test.apk)
        env:
          MIRROR_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MIRROR_UPLOAD_KEYSTORE_BASE64 }}
          MIRROR_UPLOAD_STORE_PASSWORD: ${{ secrets.MIRROR_UPLOAD_STORE_PASSWORD }}
          MIRROR_UPLOAD_KEY_ALIAS: ${{ secrets.MIRROR_UPLOAD_KEY_ALIAS }}
          MIRROR_UPLOAD_KEY_PASSWORD: ${{ secrets.MIRROR_UPLOAD_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          if [ -n "$MIRROR_UPLOAD_KEYSTORE_BASE64" ] && [ -n "$MIRROR_UPLOAD_STORE_PASSWORD" ] && [ -n "$MIRROR_UPLOAD_KEY_ALIAS" ]; then
            UPLOAD_KS=$(mktemp /tmp/mirror-upload-XXXXXX.keystore)
            trap 'rm -f "$UPLOAD_KS"' EXIT
            echo "$MIRROR_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$UPLOAD_KS"
            export MIRROR_UPLOAD_STORE_FILE="$UPLOAD_KS"
            export MIRROR_UPLOAD_KEY_PASSWORD="${MIRROR_UPLOAD_KEY_PASSWORD:-$MIRROR_UPLOAD_STORE_PASSWORD}"
            ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon 2>&1 | tee ../../.reports/gradle-assembleRelease.log
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mirror-${{ github.ref_name }}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mirror-test.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/mirror-${{ github.ref_name }}-release.aab"
            rm -f "$UPLOAD_KS"
          else
            echo "::warning::MIRROR_UPLOAD_KEYSTORE_* not configured - building debug-signed mirror-test.apk"
            ./gradlew :app:assembleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/apps/mobile/android/app/debug.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android 2>&1 | tee ../../.reports/gradle-assembleRelease.log
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/mirror-test.apk"
          fi
          cp "$GITHUB_WORKSPACE/mirror-test.apk" "$GITHUB_WORKSPACE/.reports/mirror-test.apk" || true
          ls -lh "$GITHUB_WORKSPACE"/mirror*.apk "$GITHUB_WORKSPACE"/mirror*.aab 2>/dev/null || true

      - name: Generate changelog
        run: |
          node scripts/release/changelog.mjs ${{ github.ref_name }}
          cat CHANGELOG.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - Mirror Android (Tier D on-device)
          body_path: CHANGELOG.md
          files: |
            mirror-${{ github.ref_name }}-release.apk
            mirror-${{ github.ref_name }}-release.aab
            mirror-test.apk
            .reports/merged-manifest-debug.json
            .reports/merged-manifest-release.json
            CHANGELOG.md
            docs/deployment.md
          fail_on_unmatched_files: false

      - name: Upload artifacts (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            mirror-${{ github.ref_name }}-release.apk
            mirror-${{ github.ref_name }}-release.aab
            mirror-test.apk
            .reports/
            CHANGELOG.md
          if-no-files-found: warn
