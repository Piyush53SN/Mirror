name: Android build + manifest gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (debug or release)
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Gradle debug + merged-manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install platforms
        run: |
          echo "Runner SDK at $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install node deps
        run: npm ci

      - name: Expo prebuild (android)
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean --non-interactive
          ls -la android/gradlew
          chmod +x android/gradlew
          ./android/gradlew --version

      - name: Build + gate (make android-build)
        run: |
          make android-build

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-debug-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload merged-manifest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest-report
          path: |
            .reports/merged-manifest.json
            .reports/
          if-no-files-found: warn

  release-preflight:
    name: Release Stage-1 preflight (no signing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install node deps
        run: npm ci

      - name: Run release Stage-1 preflight (no signing)
        run: |
          make release-stage1

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stage1-preflight
          path: .reports/
          if-no-files-found: warn
