name: Android build + manifest gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (debug or release)
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Gradle debug + release manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install platforms
        run: |
          echo "Runner SDK at $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install node deps
        run: npm ci

      - name: Expo prebuild (android)
        run: |
          set -e
          cd apps/mobile
          npx expo prebuild --platform android --clean --non-interactive
          ls -la android/gradlew
          chmod +x android/gradlew
          ./android/gradlew --version
          cd ../..
          echo "Prebuild done, PWD=$(pwd)"

      - name: Build debug + gate (make android-build)
        run: |
          set -e
          echo "=== Build debug + gate ==="
          echo "GITHUB_WORKSPACE=${{ github.workspace }}"
          echo "PWD start=$(pwd)"
          make android-build
          echo "--- after make android-build, PWD=$(pwd) ---"
          echo "Listing APK outputs:"
          ls -R apps/mobile/android/app/build/outputs/apk/ || echo "no apk folder yet"
          find apps/mobile/android/app/build -name "*.apk" -type f -exec ls -lh {} \; || echo "find apk: none"
          echo "--- .reports at workspace root ---"
          ls -lh "${{ github.workspace }}/.reports/" || echo ".reports missing at root"
          cat "${{ github.workspace }}/.reports/merged-manifest.json" | head -n 30 || echo "no merged-manifest.json"
          echo "--- copying debug report ---"
          cp "${{ github.workspace }}/.reports/merged-manifest.json" "${{ github.workspace }}/.reports/merged-manifest-debug.json"
          ls -lh "${{ github.workspace }}/.reports/"
          echo "--- merged manifest debug path from gate log above should be: apps/mobile/android/app/build/intermediates/merged_manifests/debug/AndroidManifest.xml ---"

      - name: Build release manifest (unsigned) + gate release variant
        run: |
          set -e
          echo "=== Build release manifest + gate ==="
          echo "PWD start=$(pwd)"
          echo "Step 1: processReleaseMainManifest"
          cd "${{ github.workspace }}/apps/mobile/android"
          ./gradlew :app:processReleaseMainManifest --no-daemon
          echo "After processReleaseMainManifest, listing merged_manifests:"
          find app/build/intermediates -name "AndroidManifest.xml" | grep -i merged | head -n 20
          ls -lh app/build/intermediates/merged_manifests/ || true
          ls -lh app/build/intermediates/merged_manifests/release/ || true
          cd "${{ github.workspace }}"
          echo "PWD after cd back to workspace: $(pwd)"
          echo "Step 2: gate release variant (must fail loudly if forbidden perms)"
          npm run android:manifest -- --variant release
          echo "--- gate log above must show manifest path like apps/mobile/android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml ---"
          echo "Step 3: verify .reports and copy"
          ls -lh "${{ github.workspace }}/.reports/"
          cp "${{ github.workspace }}/.reports/merged-manifest.json" "${{ github.workspace }}/.reports/merged-manifest-release.json"
          echo "After copy:"
          ls -lh "${{ github.workspace }}/.reports/"
          echo "--- release gate JSONs ---"
          cat "${{ github.workspace }}/.reports/merged-manifest-release.json" | head -n 40 || echo "no release json"
          echo "Step 4: try assembleRelease (unsigned, may fail without signing config, but gate already passed)"
          cd "${{ github.workspace }}/apps/mobile/android"
          if ./gradlew :app:assembleRelease --no-daemon; then
            echo "assembleRelease succeeded (using debug keystore)"
            find app/build/outputs -name "*.apk" -o -name "*.aab" | xargs ls -lh || true
          else
            echo "::warning::assembleRelease failed (expected if no signing config), but release manifest gate passed - this is not a gate failure"
            echo "Listing any release outputs that may exist:"
            find app/build/outputs -type f | head -n 20 || true
          fi
          cd "${{ github.workspace }}"

      - name: Debug artifact paths before upload
        if: always()
        run: |
          echo "=== Final artifact debug ==="
          echo "PWD=$(pwd)"
          echo "Workspace=${{ github.workspace }}"
          echo "--- find APKs ---"
          find "${{ github.workspace }}" -type f -name "*.apk" | head -n 20
          echo "--- find AABs ---"
          find "${{ github.workspace }}" -type f -name "*.aab" | head -n 20
          echo "--- .reports ---"
          ls -R "${{ github.workspace }}/.reports/" || echo "no .reports"
          echo "--- apps/mobile/android/app/build/outputs/apk/debug ---"
          ls -lh "${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/debug/" || echo "no debug apk folder"

      - name: Upload APKs (debug + release if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-apks
          path: |
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/debug/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/bundle/**/*.aab
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - name: Upload merged-manifest reports (debug + release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest-reports
          path: |
            ${{ github.workspace }}/.reports/merged-manifest-debug.json
            ${{ github.workspace }}/.reports/merged-manifest-release.json
            ${{ github.workspace }}/.reports/merged-manifest.json
            ${{ github.workspace }}/.reports/
          if-no-files-found: error

  release-preflight:
    name: Release Stage-1 preflight (no signing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install node deps
        run: npm ci

      - name: Run release Stage-1 preflight (no signing)
        run: |
          make release-stage1
          echo "--- preflight .reports ---"
          ls -lh .reports/ || true

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stage1-preflight
          path: |
            ${{ github.workspace }}/.reports/
          if-no-files-found: warn
