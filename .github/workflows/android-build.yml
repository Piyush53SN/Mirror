name: Android build + manifest gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (debug or release)
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Gradle debug + release manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install platforms
        run: |
          echo "Runner SDK at $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install node deps
        run: npm ci

      - name: Expo prebuild (android)
        run: |
          set -eo pipefail
          cd apps/mobile
          npx expo prebuild --platform android --clean --non-interactive
          ls -la android/gradlew
          chmod +x android/gradlew
          ./android/gradlew --version
          cd "${{ github.workspace }}"
          echo "Prebuild done, PWD=$(pwd)"

      - name: Restore stable debug keystore from secret (for install-over without uninstall)
        run: |
          set -eo pipefail
          KEYSTORE_PATH="${{ github.workspace }}/apps/mobile/android/app/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring debug keystore from DEBUG_KEYSTORE_BASE64 secret"
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
            ls -lh "$KEYSTORE_PATH"
            echo "Debug keystore restored – APK signature will be stable across builds, allowing install-over without uninstall"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set – generating ephemeral debug keystore (signature will change each build, requiring uninstall and wiping SecureStore, causing key mismatch)"
            if [ ! -f "$KEYSTORE_PATH" ]; then
              if command -v keytool >/dev/null 2>&1; then
                keytool -genkeypair -v -storetype PKCS12 -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              else
                echo "keytool not found, generating with openssl"
                TMPDIR=$(mktemp -d)
                openssl genrsa -out "$TMPDIR/key.pem" 2048
                openssl req -new -x509 -key "$TMPDIR/key.pem" -out "$TMPDIR/cert.pem" -days 10000 -subj "/CN=Android Debug,O=Android,C=US"
                openssl pkcs12 -export -in "$TMPDIR/cert.pem" -inkey "$TMPDIR/key.pem" -out "$KEYSTORE_PATH" -name androiddebugkey -passout pass:android
                rm -rf "$TMPDIR"
              fi
              ls -lh "$KEYSTORE_PATH"
            else
              echo "Existing debug keystore found at $KEYSTORE_PATH, keeping it"
              ls -lh "$KEYSTORE_PATH"
            fi
          fi

      - name: Build debug + gate (make android-build)
        run: |
          set -eo pipefail
          echo "=== Build debug + gate ==="
          echo "GITHUB_WORKSPACE=${{ github.workspace }}"
          echo "PWD start=$(pwd)"
          make android-build
          echo "--- after make android-build, PWD=$(pwd) ---"
          ls -lh "${{ github.workspace }}/.reports/"
          echo "--- Running debug gate with --json and tee (fail loudly) ---"
          mkdir -p "${{ github.workspace }}/.reports"
          npm run android:manifest -- --variant debug --json "${{ github.workspace }}/.reports/merged-manifest-debug.json" 2>&1 | tee "${{ github.workspace }}/.reports/merged-manifest-debug.txt"
          echo "--- debug gate outputs ---"
          ls -lh "${{ github.workspace }}/.reports/"
          cat "${{ github.workspace }}/.reports/merged-manifest-debug.json" | head -n 20
          cat "${{ github.workspace }}/.reports/merged-manifest-debug.txt" | head -n 30
          echo "--- APKs ---"
          find "${{ github.workspace }}/apps/mobile/android/app/build" -name "*.apk" -type f -exec ls -lh {} \;
          echo "--- merged manifest debug path should be: apps/mobile/android/app/build/intermediates/merged_manifests/debug/AndroidManifest.xml ---"

      - name: Build release manifest (unsigned) + gate release variant
        run: |
          set -eo pipefail
          echo "=== Build release manifest + gate ==="
          mkdir -p "${{ github.workspace }}/.reports"
          echo "Step 1: processReleaseManifest (full merge) with full log to .reports/gradle-release.log"
          cd "${{ github.workspace }}/apps/mobile/android"
          set +e
          ./gradlew :app:processReleaseManifest --no-daemon --stacktrace 2>&1 | tee "${{ github.workspace }}/.reports/gradle-release.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Gradle exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== What went wrong block ==="
            grep -n -A 100 "What went wrong" "${{ github.workspace }}/.reports/gradle-release.log" | head -n 200 || true
            echo "=== Manifest merger failed lines ==="
            grep -n -i -A 5 -B 5 "Manifest merger failed" "${{ github.workspace }}/.reports/gradle-release.log" | head -n 300 || true
            echo "=== AndroidManifest.xml Error lines ==="
            grep -n -i "AndroidManifest.xml.*Error" "${{ github.workspace }}/.reports/gradle-release.log" | head -n 100 || true
            echo "=== manifest-merger-release-report.txt ==="
            find app/build -name "manifest-merger-release-report.txt" -type f | while read f; do echo "--- $f ---"; cat "$f" | tail -n 500; done || true
            echo "=== Full gradle-release.log tail ==="
            tail -n 500 "${{ github.workspace }}/.reports/gradle-release.log" || true
            exit $EXIT_CODE
          fi
          echo "After processReleaseManifest, listing merged manifests:"
          find app/build/intermediates -type f -name "AndroidManifest.xml" | grep -i merged | sort | head -n 40
          find app/build/intermediates/merged_manifests -type f 2>/dev/null | sort | head -n 40 || echo "merged_manifests not found, checking merged_manifest"
          find app/build/intermediates/merged_manifest -type f 2>/dev/null | sort | head -n 40 || echo "merged_manifest not found"
          cd "${{ github.workspace }}"
          echo "Step 2: gate release variant"
          mkdir -p "${{ github.workspace }}/.reports"
          npm run android:manifest -- --variant release --json "${{ github.workspace }}/.reports/merged-manifest-release.json" 2>&1 | tee "${{ github.workspace }}/.reports/merged-manifest-release.txt"
          echo "Step 3: verify .reports"
          ls -lh "${{ github.workspace }}/.reports/"
          cat "${{ github.workspace }}/.reports/merged-manifest-release.json" | head -n 60
          cat "${{ github.workspace }}/.reports/merged-manifest-release.txt" | head -n 60

      - name: Build phone-testable APK (mirror-test.apk, debug-signed, not for stores)
        run: |
          set -eo pipefail
          echo "=== Build phone-testable APK ==="
          mkdir -p "${{ github.workspace }}/.reports"
          cd "${{ github.workspace }}/apps/mobile/android"
          DEBUG_KEYSTORE="app/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            mkdir -p app
            keytool -genkeypair -v -storetype PKCS12 -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          set +e
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/apps/mobile/android/app/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android 2>&1 | tee "${{ github.workspace }}/.reports/gradle-assembleRelease.log"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "Gradle assembleRelease exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== What went wrong block (assembleRelease) ==="
            grep -n -A 200 "What went wrong" "${{ github.workspace }}/.reports/gradle-assembleRelease.log" | head -n 400 || true
            echo "=== Task failures (bundle / R8 / compile) ==="
            grep -n -i -E -A 20 -B 10 "createBundleReleaseJsAndAssets|Bundling failed|SyntaxError|Unexpected token|minifyReleaseWithR8|Missing class|R8:.*Missing|Execution failed for task" "${{ github.workspace }}/.reports/gradle-assembleRelease.log" | head -n 800 || true
            echo "=== Full gradle-assembleRelease.log tail ==="
            tail -n 1200 "${{ github.workspace }}/.reports/gradle-assembleRelease.log" || true
            exit $EXIT_CODE
          fi
          find app/build/outputs -type f -name "*.apk" | xargs ls -lh || true
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/mirror-test.apk"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/.reports/mirror-test.apk" || true
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/mirror-test.apk || true
          ls -lh "${{ github.workspace }}/mirror-test.apk"

      - name: Debug artifact paths before upload
        if: always()
        run: |
          echo "=== Final artifact debug ==="
          echo "PWD=$(pwd)"
          find "${{ github.workspace }}" -type f -name "*.apk" | head -n 20
          find "${{ github.workspace }}" -type f -name "*.aab" | head -n 20
          ls -R "${{ github.workspace }}/.reports/" || echo "no .reports"
          ls -lh "${{ github.workspace }}/mirror-test.apk" || echo "no mirror-test.apk at root"

      - name: Upload APKs (debug + release + phone-testable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-apks
          path: |
            ${{ github.workspace }}/mirror-test.apk
            ${{ github.workspace }}/.reports/mirror-test.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/mirror-test.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/debug/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/bundle/**/*.aab
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - name: Upload merged-manifest reports (debug + release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest-reports
          path: |
            ${{ github.workspace }}/.reports/merged-manifest-debug.json
            ${{ github.workspace }}/.reports/merged-manifest-release.json
            ${{ github.workspace }}/.reports/merged-manifest-debug.txt
            ${{ github.workspace }}/.reports/merged-manifest-release.txt
            ${{ github.workspace }}/.reports/merged-manifest.json
            ${{ github.workspace }}/.reports/gradle-release.log
            ${{ github.workspace }}/.reports/gradle-assembleRelease.log
            ${{ github.workspace }}/.reports/mirror-test.apk
            ${{ github.workspace }}/.reports/
            ${{ github.workspace }}/mirror-test.apk
          if-no-files-found: error
          include-hidden-files: true

  android-smoke-test:
    name: Smoke test release APK on emulator (non-blocking until stable)
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chown root:kvm /dev/kvm || true
          sudo chmod 0666 /dev/kvm || true
          ls -lh /dev/kvm || true
          egrep -c '(vmx|svm)' /proc/cpuinfo || true

      - name: Download mirror-test APK
        uses: actions/download-artifact@v4
        with:
          name: mirror-apks
          path: ${{ github.workspace }}/smoke-apks

      - name: Find APK
        run: |
          set -eo pipefail
          APK=$(find "${{ github.workspace }}/smoke-apks" -name "mirror-test.apk" | head -n 1)
          if [ -z "$APK" ]; then APK=$(find "${{ github.workspace }}/smoke-apks" -name "app-release.apk" | head -n 1); fi
          if [ -z "$APK" ]; then APK=$(find "${{ github.workspace }}/smoke-apks" -name "*.apk" | head -n 1); fi
          echo "APK=$APK" >> $GITHUB_ENV
          ls -lh "$APK"

      - name: Run emulator and smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android/smoke-test.sh "$APK"

  release-preflight:
    name: Release Stage-1 preflight (no signing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install node deps
        run: npm ci

      - name: Run release Stage-1 preflight
        run: |
          make release-stage1
          ls -lh .reports/ || true

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stage1-preflight
          path: |
            ${{ github.workspace }}/.reports/
          if-no-files-found: warn
          include-hidden-files: true
