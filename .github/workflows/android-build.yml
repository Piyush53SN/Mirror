name: Android build + manifest gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      variant:
        description: Build variant (debug or release)
        type: choice
        options: [debug, release]
        default: debug

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Gradle debug + release manifest gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK and install platforms
        run: |
          echo "Runner SDK at $ANDROID_HOME"
          ls -la "$ANDROID_HOME/cmdline-tools/" || true
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          "$SDKMANAGER" --list_installed || true
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Install node deps
        run: npm ci

      - name: Expo prebuild (android)
        run: |
          set -eo pipefail
          cd apps/mobile
          npx expo prebuild --platform android --clean --non-interactive
          ls -la android/gradlew
          chmod +x android/gradlew
          ./android/gradlew --version
          cd "${{ github.workspace }}"
          echo "Prebuild done, PWD=$(pwd)"

      - name: Build debug + gate (make android-build)
        run: |
          set -eo pipefail
          echo "=== Build debug + gate ==="
          echo "GITHUB_WORKSPACE=${{ github.workspace }}"
          echo "PWD start=$(pwd)"
          make android-build
          echo "--- after make android-build, PWD=$(pwd) ---"
          ls -lh "${{ github.workspace }}/.reports/"
          echo "--- Running debug gate with --json and tee (fail loudly) ---"
          mkdir -p "${{ github.workspace }}/.reports"
          npm run android:manifest -- --variant debug --json "${{ github.workspace }}/.reports/merged-manifest-debug.json" 2>&1 | tee "${{ github.workspace }}/.reports/merged-manifest-debug.txt"
          echo "--- debug gate outputs ---"
          ls -lh "${{ github.workspace }}/.reports/"
          cat "${{ github.workspace }}/.reports/merged-manifest-debug.json" | head -n 20
          cat "${{ github.workspace }}/.reports/merged-manifest-debug.txt" | head -n 30
          echo "--- APKs ---"
          find "${{ github.workspace }}/apps/mobile/android/app/build" -name "*.apk" -type f -exec ls -lh {} \;
          echo "--- merged manifest debug path should be: apps/mobile/android/app/build/intermediates/merged_manifests/debug/AndroidManifest.xml ---"

      - name: Build release manifest (unsigned) + gate release variant
        run: |
          set -eo pipefail
          echo "=== Build release manifest + gate ==="
          echo "PWD start=$(pwd)"
          echo "Step 1: processReleaseManifest (full merge, NOT processReleaseMainManifest which is partial) with --stacktrace for diagnostics"
          cd "${{ github.workspace }}/apps/mobile/android"
          ./gradlew :app:processReleaseManifest --no-daemon --stacktrace --info || (echo "=== FAILED, dumping merger logs ==="; find app/build -name "*.log" -o -name "manifest-merger-*.xml" | head -n 20; cat app/build/outputs/logs/manifest-merger-release-report.txt 2>/dev/null | tail -n 300 || true; ./gradlew :app:processReleaseManifest --no-daemon --stacktrace; exit 1)
          echo "After processReleaseManifest, listing merged manifests (find-based, not strict ls):"
          find app/build/intermediates -type f -name "AndroidManifest.xml" | grep -i merged | sort | head -n 40
          echo "--- listing merged_manifests folder if exists ---"
          find app/build/intermediates/merged_manifests -type f 2>/dev/null | sort | head -n 40 || echo "merged_manifests not found, checking merged_manifest"
          find app/build/intermediates/merged_manifest -type f 2>/dev/null | sort | head -n 40 || echo "merged_manifest not found"
          cd "${{ github.workspace }}"
          echo "PWD after cd back to workspace: $(pwd)"
          echo "Step 2: gate release variant (must read FINAL merged release manifest at merged_manifests/release/... not partial MainManifest)"
          mkdir -p "${{ github.workspace }}/.reports"
          npm run android:manifest -- --variant release --json "${{ github.workspace }}/.reports/merged-manifest-release.json" 2>&1 | tee "${{ github.workspace }}/.reports/merged-manifest-release.txt"
          echo "--- gate log above must show FINAL manifest path like apps/mobile/android/app/build/intermediates/merged_manifests/release/AndroidManifest.xml (not .../processReleaseMainManifest/...) ---"
          echo "Step 3: verify .reports"
          ls -lh "${{ github.workspace }}/.reports/"
          cat "${{ github.workspace }}/.reports/merged-manifest-release.json" | head -n 60
          cat "${{ github.workspace }}/.reports/merged-manifest-release.txt" | head -n 60

      - name: Build phone-testable APK (mirror-test.apk, debug-signed, not for stores)
        run: |
          set -eo pipefail
          echo "=== Build phone-testable APK ==="
          echo "Debug APK (app-debug.apk) from assembleDebug needs Metro bundler and shows 'Unable to load script' on phone."
          echo "For phone testing we need a self-contained release APK signed with debug keystore."
          cd "${{ github.workspace }}/apps/mobile/android"
          DEBUG_KEYSTORE="app/debug.keystore"
          if [ ! -f "$DEBUG_KEYSTORE" ]; then
            echo "debug.keystore not found at $DEBUG_KEYSTORE, generating..."
            mkdir -p app
            keytool -genkeypair -v -storetype PKCS12 -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || echo "keytool failed, will try default"
          fi
          ls -lh app/debug.keystore || echo "no debug.keystore"
          echo "Building release APK with debug signing (not for Play Store)..."
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="${{ github.workspace }}/apps/mobile/android/app/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          echo "--- release outputs ---"
          find app/build/outputs -type f -name "*.apk" | xargs ls -lh || true
          echo "--- copying to mirror-test.apk (phone-testable, debug-signed, not for stores) ---"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/mirror-test.apk"
          cp app/build/outputs/apk/release/app-release.apk "${{ github.workspace }}/.reports/mirror-test.apk" || true
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/mirror-test.apk || true
          ls -lh "${{ github.workspace }}/mirror-test.apk"
          ls -lh "${{ github.workspace }}/.reports/mirror-test.apk" || true
          echo "mirror-test.apk is a self-contained release build signed with debug keystore for phone testing only. Not for Play Store."

      - name: Debug artifact paths before upload
        if: always()
        run: |
          echo "=== Final artifact debug ==="
          echo "PWD=$(pwd)"
          echo "Workspace=${{ github.workspace }}"
          echo "--- find APKs ---"
          find "${{ github.workspace }}" -type f -name "*.apk" | head -n 20
          echo "--- find AABs ---"
          find "${{ github.workspace }}" -type f -name "*.aab" | head -n 20
          echo "--- .reports ---"
          ls -R "${{ github.workspace }}/.reports/" || echo "no .reports"
          echo "--- mirror-test.apk ---"
          ls -lh "${{ github.workspace }}/mirror-test.apk" || echo "no mirror-test.apk at root"
          ls -lh "${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/" || true

      - name: Upload APKs (debug + release + phone-testable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-apks
          path: |
            ${{ github.workspace }}/mirror-test.apk
            ${{ github.workspace }}/.reports/mirror-test.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/mirror-test.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/debug/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/release/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/apk/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/bundle/**/*.aab
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.apk
            ${{ github.workspace }}/apps/mobile/android/app/build/outputs/**/*.aab
          if-no-files-found: error

      - name: Upload merged-manifest reports (debug + release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-manifest-reports
          path: |
            ${{ github.workspace }}/.reports/merged-manifest-debug.json
            ${{ github.workspace }}/.reports/merged-manifest-release.json
            ${{ github.workspace }}/.reports/merged-manifest-debug.txt
            ${{ github.workspace }}/.reports/merged-manifest-release.txt
            ${{ github.workspace }}/.reports/merged-manifest.json
            ${{ github.workspace }}/.reports/mirror-test.apk
            ${{ github.workspace }}/.reports/
            ${{ github.workspace }}/mirror-test.apk
          if-no-files-found: error
          include-hidden-files: true

  android-smoke-test:
    name: Smoke test release APK on emulator (non-blocking until stable)
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for emulator (hardening against boot timeout)
        run: |
          echo "=== KVM setup ==="
          # GitHub ubuntu-latest has /dev/kvm but permissions may block emulator
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chown root:kvm /dev/kvm || true
          sudo chmod 0666 /dev/kvm || true
          ls -lh /dev/kvm || echo "no /dev/kvm"
          # cpu check
          egrep -c '(vmx|svm)' /proc/cpuinfo || echo "no vmx/svm"
          id
          groups || true

      - name: Download mirror-test APK
        uses: actions/download-artifact@v4
        with:
          name: mirror-apks
          path: ${{ github.workspace }}/smoke-apks

      - name: Find APK
        run: |
          set -eo pipefail
          echo "--- downloaded APKs ---"
          find "${{ github.workspace }}/smoke-apks" -type f -name "*.apk" | head -n 20
          ls -lh "${{ github.workspace }}/smoke-apks/" || true
          # Prefer mirror-test.apk, fallback to app-release.apk
          APK=$(find "${{ github.workspace }}/smoke-apks" -name "mirror-test.apk" | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find "${{ github.workspace }}/smoke-apks" -name "app-release.apk" | head -n 1)
          fi
          if [ -z "$APK" ]; then
            APK=$(find "${{ github.workspace }}/smoke-apks" -name "*.apk" | head -n 1)
          fi
          echo "Using APK: $APK"
          echo "APK=$APK" >> $GITHUB_ENV
          ls -lh "$APK"

      - name: Run emulator and smoke test (API 33 default, KVM, 900s boot timeout)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/android/smoke-test.sh "$APK"

  release-preflight:
    name: Release Stage-1 preflight (no signing)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install node deps
        run: npm ci

      - name: Run release Stage-1 preflight (no signing)
        run: |
          make release-stage1
          echo "--- preflight .reports ---"
          ls -lh .reports/ || true

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-stage1-preflight
          path: |
            ${{ github.workspace }}/.reports/
          if-no-files-found: warn
          include-hidden-files: true
