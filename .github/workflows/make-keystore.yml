name: Make debug keystore

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Create keystore and print base64
        run: |
          keytool -genkeypair -storetype PKCS12 -keystore debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          base64 -w 0 debug.keystore > ks.b64
          echo "$(cat ks.b64)" | sed 's/./& /g'
